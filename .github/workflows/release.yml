name: Release

# Automated releases via release-please. Merging a Conventional Commit PR to
# main opens or updates a Release PR. Merging that Release PR tags vX.Y.Z and
# creates the GitHub Release. Nothing is published to a package registry.
# See RELEASING.md.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create release commits, tags, and GitHub releases
      pull-requests: write   # open/update the Release PR
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
